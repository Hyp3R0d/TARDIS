[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tardis-video"
version = "0.1.0"
description = "Transport-aligned residual diffusion in innovation subspaces for streaming video generation"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "TARDIS Contributors" }]
keywords = ["diffusion", "text-to-video", "temporal-consistency", "computer-vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate>=1.0,<2",
  "av>=14,<19",
  "diffusers>=0.34,<1",
  "httpx>=0.27,<1",
  "ijson>=3.3,<4",
  "lpips>=0.1.4,<1",
  "numpy>=2.0,<3",
  "open-clip-torch>=2.30,<3",
  "opencv-python-headless>=4.10,<5",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pytorchvideo>=0.1.5,<0.2",
  "safetensors>=0.5,<1",
  "scipy>=1.14,<2",
  "torch>=2.8,<2.9",
  "torch-fidelity>=0.3,<1",
  "torchmetrics>=1.6,<2",
  "torchvision>=0.23,<0.24",
  "tqdm>=4.66,<5",
  "transformers>=4.50,<5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["tardis"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]
markers = [
  "unit: isolated deterministic unit tests",
  "integration: tests spanning multiple package boundaries",
  "e2e: production entry-point tests",
  "gpu: tests requiring a CUDA-capable GPU",
  "remote: tests accessing explicitly approved remote mirrors",
  "slow: tests unsuitable for the fast CI lane",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".worktrees", "docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tardis"]
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["tardis"]

[tool.coverage.report]
show_missing = true
skip_covered = true
