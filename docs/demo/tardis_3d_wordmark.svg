<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">TARDIS</title>
  <desc id="desc">Three-dimensional gunmetal TARDIS wordmark with armored panel cuts, cyan energy edges, and restrained amber HUD accents.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#f5feff"/>
      <stop offset="0.13" stop-color="#bfd9e0"/>
      <stop offset="0.38" stop-color="#6c8c98"/>
      <stop offset="0.68" stop-color="#263946"/>
      <stop offset="1" stop-color="#070d16"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6fbff"/>
      <stop offset="0.28" stop-color="#49deef"/>
      <stop offset="0.62" stop-color="#147b9b"/>
      <stop offset="1" stop-color="#071629"/>
    </linearGradient>
    <linearGradient id="extrude" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4a62"/>
      <stop offset="0.36" stop-color="#0c263d"/>
      <stop offset="0.78" stop-color="#050d1c"/>
      <stop offset="1" stop-color="#01050b"/>
    </linearGradient>
    <linearGradient id="cyanEnergy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a9dbb"/>
      <stop offset="0.5" stop-color="#8af5ff"/>
      <stop offset="1" stop-color="#1a9dbb"/>
    </linearGradient>
    <linearGradient id="amberEnergy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e4a21"/>
      <stop offset="0.5" stop-color="#ffc269"/>
      <stop offset="1" stop-color="#8e4a21"/>
    </linearGradient>
    <pattern id="scan" width="18" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 1 H18" stroke="#e9feff" stroke-width="1" opacity="0.32"/>
      <path d="M0 7 H18" stroke="#06121e" stroke-width="1" opacity="0.32"/>
    </pattern>
    <clipPath id="wordClip" clipPathUnits="userSpaceOnUse">
      <text x="82" y="174" font-family="Arial Black, Impact, Haettenschweiler, sans-serif" font-size="184" font-weight="900" font-style="italic" letter-spacing="8">TARDIS</text>
    </clipPath>
    <filter id="cyanGlow" x="-25%" y="-55%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.04  0 0 0 0 0.72  0 0 0 0 0.98  0 0 0 .7 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amberGlow" x="-25%" y="-100%" width="150%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.98  0 0 0 0 0.42  0 0 0 0 0.08  0 0 0 .65 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#01050b" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Minimal HUD frame: it stays outside the lettering so the mark remains readable on any background. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55 87 V55 H80 L99 38 H196" stroke="#2b93ae" stroke-width="3" opacity="0.85"/>
    <path d="M55 87 V63" stroke="#a9f8ff" stroke-width="1.4"/>
    <path d="M1040 38 H1116 L1135 55 V87" stroke="#2b93ae" stroke-width="3" opacity="0.85"/>
    <path d="M1135 63 V87" stroke="#a9f8ff" stroke-width="1.4"/>
    <path d="M57 204 V222 H88 L103 238 H267" stroke="#23677e" stroke-width="2.5" opacity="0.9"/>
    <path d="M1133 204 V222 H1102 L1087 238 H923" stroke="#23677e" stroke-width="2.5" opacity="0.9"/>
    <path d="M64 112 H88 M64 120 H78 M1102 112 H1126 M1112 120 H1126" stroke="#6fddec" stroke-width="2" opacity="0.8"/>
    <circle cx="70" cy="96" r="4.5" fill="#0b2b40" stroke="#65e8f5" stroke-width="2"/>
    <circle cx="1120" cy="96" r="4.5" fill="#0b2b40" stroke="#65e8f5" stroke-width="2"/>
    <circle cx="93" cy="231" r="3" fill="#ffb35a" stroke="#ffcf88" stroke-width="1.2" filter="url(#amberGlow)"/>
    <circle cx="1097" cy="231" r="3" fill="#ffb35a" stroke="#ffcf88" stroke-width="1.2" filter="url(#amberGlow)"/>
  </g>

  <g transform="skewX(-8)" font-family="Arial Black, Impact, Haettenschweiler, sans-serif" font-size="184" font-weight="900" font-style="italic" letter-spacing="8">
    <!-- Layered armor extrusion -->
    <text x="108" y="205" fill="#01050b" opacity="0.9" stroke="#01050b" stroke-width="26" stroke-linejoin="round">TARDIS</text>
    <text x="101" y="198" fill="url(#extrude)" stroke="#030b17" stroke-width="23" stroke-linejoin="round">TARDIS</text>
    <text x="94" y="191" fill="#0b253b" stroke="#0a1527" stroke-width="18" stroke-linejoin="round">TARDIS</text>

    <!-- Hard cyan armor rim -->
    <text x="82" y="181" fill="url(#edge)" stroke="#78effa" stroke-opacity="0.92" stroke-width="10" stroke-linejoin="round" filter="url(#cyanGlow)">TARDIS</text>
    <text x="82" y="174" fill="url(#face)" stroke="#e1fdff" stroke-width="2.2" stroke-linejoin="round" filter="url(#shadow)">TARDIS</text>
    <text x="84" y="167" fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="2.4" stroke-linejoin="round">TARDIS</text>

    <!-- Subtle panel seams, scan texture, and angular cutouts clipped to the glyphs. -->
    <g clip-path="url(#wordClip)" opacity="0.34">
      <rect x="42" y="35" width="1060" height="155" fill="url(#scan)"/>
      <path d="M144 67 H280 L300 83 H380" stroke="#d9fcff" stroke-width="3"/>
      <path d="M405 62 H510 L528 78 H606" stroke="#071523" stroke-width="5"/>
      <path d="M680 92 H760 L778 76 H860" stroke="#d9fcff" stroke-width="2.8"/>
      <path d="M865 141 H958 L979 123 H1050" stroke="#061422" stroke-width="5"/>
      <path d="M217 45 L250 72 L194 122 L161 95 Z" fill="#020a14" opacity="0.8"/>
      <path d="M486 115 L520 139 L479 176 L445 151 Z" fill="#071725" opacity="0.9"/>
      <path d="M760 47 L792 71 L745 111 L713 87 Z" fill="#020a14" opacity="0.72"/>
      <path d="M972 88 L1002 111 L958 149 L928 126 Z" fill="#071725" opacity="0.9"/>
    </g>

    <!-- Tiny mechanical fasteners on the face. -->
    <g clip-path="url(#wordClip)" fill="#d8fbff" stroke="#173b4d" stroke-width="2" opacity="0.9">
      <circle cx="178" cy="119" r="4"/>
      <circle cx="360" cy="95" r="3.5"/>
      <circle cx="620" cy="128" r="4"/>
      <circle cx="902" cy="99" r="3.5"/>
    </g>
  </g>

  <!-- Segmented reactor bar and amber service ticks. -->
  <g fill="none" stroke-linecap="round">
    <path d="M137 218 H338 M353 218 H536 M551 218 H733 M748 218 H930 M945 218 H1048" stroke="#071725" stroke-width="8" opacity="0.95"/>
    <path d="M137 218 H338 M353 218 H536 M551 218 H733 M748 218 H930" stroke="url(#cyanEnergy)" stroke-width="3.2" filter="url(#cyanGlow)"/>
    <path d="M945 218 H1048" stroke="url(#amberEnergy)" stroke-width="3.2" filter="url(#amberGlow)"/>
    <path d="M126 212 V224 M346 212 V224 M544 212 V224 M741 212 V224 M938 212 V224 M1058 212 V224" stroke="#76eaf5" stroke-width="2"/>
    <path d="M1070 218 H1090" stroke="#ffad50" stroke-width="2" opacity="0.9"/>
  </g>
</svg>
