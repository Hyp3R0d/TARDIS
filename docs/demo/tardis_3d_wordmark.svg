<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">TARDIS</title>
  <desc id="desc">Three-dimensional metallic TARDIS game-style wordmark with cyan and magenta neon highlights.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f6feff"/>
      <stop offset="0.16" stop-color="#8cecff"/>
      <stop offset="0.48" stop-color="#1d9fca"/>
      <stop offset="0.76" stop-color="#126080"/>
      <stop offset="1" stop-color="#071b32"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff5ff"/>
      <stop offset="0.45" stop-color="#147696"/>
      <stop offset="1" stop-color="#071124"/>
    </linearGradient>
    <linearGradient id="extrude" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123b5b"/>
      <stop offset="0.42" stop-color="#07172e"/>
      <stop offset="1" stop-color="#020814"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.75  0 0 0 0 1  0 0 0 .75 0" result="cyanGlow"/>
      <feMerge><feMergeNode in="cyanGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="10" flood-color="#020611" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g transform="skewX(-8)" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="184" font-weight="900" font-style="italic" letter-spacing="8">
    <text x="97" y="197" fill="#020711" opacity="0.8" stroke="#020711" stroke-width="24" stroke-linejoin="round">TARDIS</text>
    <text x="88" y="188" fill="url(#extrude)" stroke="#030a18" stroke-width="22" stroke-linejoin="round">TARDIS</text>
    <text x="82" y="181" fill="url(#edge)" stroke="#7beeff" stroke-opacity="0.9" stroke-width="10" stroke-linejoin="round" filter="url(#glow)">TARDIS</text>
    <text x="82" y="174" fill="url(#face)" stroke="#d9fdff" stroke-width="2.2" stroke-linejoin="round" filter="url(#shadow)">TARDIS</text>
    <text x="84" y="167" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5" stroke-linejoin="round">TARDIS</text>
    <path d="M105 187 L1010 187" stroke="url(#magenta)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
