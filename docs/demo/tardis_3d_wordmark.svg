<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">TARDIS</title>
  <desc id="desc">Clean three-dimensional gunmetal TARDIS wordmark with restrained armored panel cuts.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#c7d2d6"/>
      <stop offset="0.13" stop-color="#9aaab0"/>
      <stop offset="0.38" stop-color="#657781"/>
      <stop offset="0.68" stop-color="#354650"/>
      <stop offset="1" stop-color="#070d16"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#718894"/>
      <stop offset="0.28" stop-color="#4c6472"/>
      <stop offset="0.62" stop-color="#263b4b"/>
      <stop offset="1" stop-color="#071629"/>
    </linearGradient>
    <linearGradient id="extrude" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4a62"/>
      <stop offset="0.36" stop-color="#0c263d"/>
      <stop offset="0.78" stop-color="#050d1c"/>
      <stop offset="1" stop-color="#01050b"/>
    </linearGradient>
    <pattern id="scan" width="18" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 1 H18" stroke="#d5e0e3" stroke-width="1" opacity="0.16"/>
      <path d="M0 7 H18" stroke="#06121e" stroke-width="1" opacity="0.32"/>
    </pattern>
    <clipPath id="wordClip" clipPathUnits="userSpaceOnUse">
      <text x="82" y="174" font-family="Arial Black, Impact, Haettenschweiler, sans-serif" font-size="184" font-weight="900" font-style="italic" letter-spacing="8">TARDIS</text>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#01050b" flood-opacity="0.9"/>
    </filter>
  </defs>

  <g transform="skewX(-8)" font-family="Arial Black, Impact, Haettenschweiler, sans-serif" font-size="184" font-weight="900" font-style="italic" letter-spacing="8">
    <!-- Layered armor extrusion -->
    <text x="108" y="205" fill="#01050b" opacity="0.9" stroke="#01050b" stroke-width="26" stroke-linejoin="round">TARDIS</text>
    <text x="101" y="198" fill="url(#extrude)" stroke="#030b17" stroke-width="23" stroke-linejoin="round">TARDIS</text>
    <text x="94" y="191" fill="#0b253b" stroke="#0a1527" stroke-width="18" stroke-linejoin="round">TARDIS</text>

    <!-- Restrained steel armor rim; no external frame or bright decorative rails. -->
    <text x="82" y="181" fill="url(#edge)" stroke="#0c1d2c" stroke-opacity="0.98" stroke-width="8" stroke-linejoin="round">TARDIS</text>
    <text x="82" y="174" fill="url(#face)" stroke="#334852" stroke-opacity="0.9" stroke-width="1.8" stroke-linejoin="round" filter="url(#shadow)">TARDIS</text>

    <!-- Subtle panel seams, scan texture, and angular cutouts clipped to the glyphs. -->
    <g clip-path="url(#wordClip)" opacity="0.2">
      <rect x="42" y="35" width="1060" height="155" fill="url(#scan)"/>
      <path d="M144 67 H280 L300 83 H380" stroke="#b4c3c8" stroke-width="2"/>
      <path d="M405 62 H510 L528 78 H606" stroke="#071523" stroke-width="5"/>
      <path d="M680 92 H760 L778 76 H860" stroke="#b4c3c8" stroke-width="2"/>
      <path d="M865 141 H958 L979 123 H1050" stroke="#061422" stroke-width="5"/>
      <path d="M217 45 L250 72 L194 122 L161 95 Z" fill="#020a14" opacity="0.8"/>
      <path d="M486 115 L520 139 L479 176 L445 151 Z" fill="#071725" opacity="0.9"/>
      <path d="M760 47 L792 71 L745 111 L713 87 Z" fill="#020a14" opacity="0.72"/>
      <path d="M972 88 L1002 111 L958 149 L928 126 Z" fill="#071725" opacity="0.9"/>
    </g>

    <!-- Tiny mechanical fasteners on the face. -->
    <g clip-path="url(#wordClip)" fill="#93a3aa" stroke="#1b2d38" stroke-width="2" opacity="0.5">
      <circle cx="178" cy="119" r="3.5"/>
      <circle cx="360" cy="95" r="3"/>
      <circle cx="620" cy="128" r="3.5"/>
      <circle cx="902" cy="99" r="3"/>
    </g>
  </g>

</svg>
